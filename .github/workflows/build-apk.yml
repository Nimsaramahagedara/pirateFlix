name: Build Android TV APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Easy Identification
        working-directory: ./android
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/cinesubz-tv-release.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinesubz-tv-release-apk
          path: android/output/cinesubz-tv-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/output/cinesubz-tv-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
